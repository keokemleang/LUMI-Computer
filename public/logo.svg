<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
	 viewBox="0 0 30 30" style="enable-background:new 0 0 30 30;" xml:space="preserve">
<defs>
  <style type="text/css">
    .badge{fill:#3457D5;stroke:#FFFFFF;stroke-width:0.6317;stroke-miterlimit:10;}
    .trace{fill:none;stroke:#FFFFFF;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
    .via{fill:#E2A63B;}
    .pad{fill:#FFFFFF;}

    .z-breathe { animation: breathe 2.5s ease-in-out infinite; }
    .via-pulse {
      animation: pulse 2.5s ease-in-out infinite;
      transform-origin: center;
      transform-box: fill-box;
    }
    @keyframes breathe { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
    @keyframes pulse {
      0%, 100% { opacity: 0.55; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .z-breathe, .via-pulse { animation: none; }
    }
  </style>
</defs>

<g>
  <path class="badge" d="M24.51,28.51H5.49c-2.21,0-4-1.79-4-4V5.49c0-2.21,1.79-4,4-4h19.03c2.21,0,4,1.79,4,4v19.03
    C28.51,26.72,26.72,28.51,24.51,28.51z"/>

  <g class="z-breathe">
    <!-- Orthogonal circuit trace: an inverted "U" spanning two component pads -->
    <path class="trace" d="M8.5,20 V13.5 H15 V9.5 H21.5 V16"/>
    <!-- component pads at each end -->
    <rect class="pad" x="6.3" y="18.4" width="4.4" height="3.2" rx="0.6"/>
    <rect class="pad" x="19.3" y="14.4" width="4.4" height="3.2" rx="0.6"/>
  </g>

  <circle class="via via-pulse" cx="15" cy="13.5" r="1.15"/>
  <circle class="via via-pulse" cx="21.5" cy="9.5" r="1.15"/>
</g>
</svg>
